<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyDesk</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--ac:#4f46e5;--ac2:#e0e7ff;--bd:#e5e7eb;--ok:#16a34a;--bad:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#181b24;--tx:#eceef4;--mu:#9aa1b2;--ac:#818cf8;--ac2:#262a45;--bd:#2a2e3b;--ok:#4ade80;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#181b24;--tx:#eceef4;--mu:#9aa1b2;--ac:#818cf8;--ac2:#262a45;--bd:#2a2e3b;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:76px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:15px;margin:18px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.quote{background:var(--ac);color:#fff;border:0}.quote small{opacity:.8}
.row{display:flex;align-items:center;gap:10px}.row>.g{flex:1;min-width:0}
.mu{color:var(--mu);font-size:13px}.bad{color:var(--bad)}.ok{color:var(--ok)}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:600}
button.x{background:none;color:var(--mu);padding:4px 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mu);font-size:11px;padding:6px 0;font-weight:500}
nav button.on{color:var(--ac);font-weight:700}nav span{display:block;font-size:19px}
input[type=checkbox]{width:20px;height:20px;margin:0}
.bubble{background:var(--ac2);border-radius:12px;padding:10px 12px;margin-bottom:8px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const Q=["Small steps every day add up to big results.","Study not to pass, but to understand.","Discipline beats motivation on tired days.","Done is better than perfect.","Future you is watching. Make them proud.","Consistency is the quiet superpower.","One focused hour beats three distracted ones."];
const TABS=[["home","🏠","Home"],["dates","📅","Dates"],["study","📚","Study"],["tasks","✅","Tasks"],["plan","🕒","Planner"],["mentor","🤖","Mentor"]];
let S={events:[],tasks:[],notes:[],cab:[],plan:[],check:[]},tab="home";
try{const r=localStorage.getItem("studydesk");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("studydesk",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const days=d=>Math.round((new Date(d+"T00:00:00")-today())/864e5);
const when=n=>n<0?`<span class="bad">${-n}d overdue</span>`:n==0?"<b>Today</b>":n==1?"Tomorrow":`in ${n}d`;
const get=id=>$("#"+id).value.trim();
function add(k,o,ids){if(!o[ids[0]])return;S[k].push(o);save();draw()}
function del(k,i){S[k].splice(i,1);save();draw()}
function tog(k,i){S[k][i].done=!S[k][i].done;save();draw()}
function go(t){tab=t;draw();scrollTo(0,0)}
function list(k,fn,empty){return S[k].length?S[k].map((x,i)=>fn(x,i)).join(""):`<p class="mu">${empty}</p>`}
const chk=(k,i,x,sub)=>`<div class="card row"><input type="checkbox" ${x.done?"checked":""} onchange="tog('${k}',${i})"><div class="g" style="${x.done?"text-decoration:line-through;opacity:.55":""}">${esc(x.t)}${sub?`<div class="mu">${sub}</div>`:""}</div><button class="x" onclick="del('${k}',${i})">✕</button></div>`;

const V={
home(){
 const q=Q[new Date().getDate()%Q.length];
 const up=S.tasks.filter(t=>!t.done).map(t=>({...t,n:days(t.due)})).sort((a,b)=>a.n-b.n).slice(0,3);
 const ex=allEv().filter(e=>e.type=="Exam"&&days(e.date)>=0).sort((a,b)=>a.date<b.date?-1:1)[0];
 const pl=S.plan.filter(p=>!p.done).length;
 return `<h1>Hello 👋</h1><div class="card quote"><small>Daily quote</small><div style="font-size:17px;margin-top:4px">“${q}”</div></div>
 ${ex?`<div class="card"><span class="tag">Next exam</span> <b>${esc(ex.title)}</b><div class="mu">${ex.date} · ${when(days(ex.date))}</div></div>`:""}
 ${newsHTML()}${calHTML()}<h2>Due soon</h2>${up.length?up.map(t=>`<div class="card row"><div class="g"><b>${esc(t.t)}</b></div><div>${when(t.n)}</div></div>`).join(""):'<p class="mu">Nothing pending. Add assignments in Tasks.</p>'}
 <h2>Today</h2><div class="card">${pl} planner item${pl==1?"":"s"} left · ${S.check.filter(c=>!c.done).length} checklist item(s) open</div><p class="mu" style="text-align:center"><a href="#" onclick="setSrv();return false">Server: ${srvLabel()}</a></p>`},
dates(){
 const ev=allEv().sort((a,b)=>a.date<b.date?-1:1);
 return `<h1>Academic calendar</h1><div class="card"><input id="et" placeholder="Event or exam (e.g. Maths CAT-1)"><div class="two"><input id="ed" type="date"><select id="ey"><option>Exam</option><option>Holiday</option><option>Event</option><option>Schedule update</option></select></div><button onclick="add('events',{title:get('et'),date:get('ed'),type:get('ey')},['title','date'])">Add</button></div>
 ${ev.length?ev.map(e=>`<div class="card row"><div class="g"><b>${e.h?"🏫 ":""}${esc(e.title)}</b><div class="mu">${e.date} · ${when(days(e.date))}</div></div><span class="tag">${esc(e.type)}</span>${e.h?(isHost?`<button class="x" onclick="hdel('events',${e.i})">✕</button>`:""):`<button class="x" onclick="del('events',${e.i})">✕</button>`}</div>`).join(""):'<p class="mu">No dates yet. Add exams and updates; changed schedules can be re-added as “Schedule update”.</p>'}`},
study(){
 return `<h1>Notes &amp; syllabus</h1>${sharedHTML()}<div class="card"><input id="ns" placeholder="Subject"><textarea id="nt" rows="3" placeholder="Note, topic list or syllabus unit"></textarea><button onclick="add('notes',{s:get('ns'),t:get('nt')},['s','t'])">Save note</button></div>
 ${list("notes",(n,i)=>`<div class="card"><div class="row"><b class="g">${esc(n.s)}</b><button class="x" onclick="del('notes',${i})">✕</button></div><div style="white-space:pre-wrap">${esc(n.t)}</div></div>`,"No notes yet.")}
 <h2>CAB observations</h2><div class="card"><input id="cs" placeholder="Subject / test"><textarea id="ct" rows="2" placeholder="What went well, what to fix"></textarea><button onclick="add('cab',{s:get('cs'),t:get('ct'),d:new Date().toISOString().slice(0,10)},['s','t'])">Log</button></div>
 ${list("cab",(n,i)=>`<div class="card"><div class="row"><b class="g">${esc(n.s)}</b><span class="mu">${n.d}</span><button class="x" onclick="del('cab',${i})">✕</button></div>${esc(n.t)}</div>`,"No observations yet.")}`},
tasks(){
 const tk=S.tasks.map((t,i)=>({...t,i})).sort((a,b)=>(a.done-b.done)||(a.due<b.due?-1:1));
 return `<h1>Assignments</h1><div class="card"><input id="tt" placeholder="Assignment"><input id="td" type="date"><button onclick="add('tasks',{t:get('tt'),due:get('td'),done:false},['t','due'])">Add deadline</button></div>
 ${tk.length?tk.map(t=>chk("tasks",t.i,t,`${t.due} · ${t.done?"done":when(days(t.due))}`)).join(""):'<p class="mu">No assignments.</p>'}
 <h2>Checklist</h2><div class="card row"><input id="ck" placeholder="e.g. Pack lab record" style="margin:0"><button onclick="add('check',{t:get('ck'),done:false},['t'])">Add</button></div>
 ${S.check.map((c,i)=>chk("check",i,c)).join("")}`},
plan(){
 const p=S.plan.map((x,i)=>({...x,i})).sort((a,b)=>a.time<b.time?-1:1);
 return `<h1>Day planner</h1><div class="card"><div class="two"><input id="pt" type="time"><input id="pn" placeholder="Activity"></div><button onclick="add('plan',{time:get('pt'),t:get('pn'),done:false},['time','t'])">Add slot</button></div>
 ${p.length?p.map(x=>chk("plan",x.i,x,x.time)).join(""):'<p class="mu">Plan your day by time slots.</p>'}
 ${S.plan.length?'<button class="x" onclick="S.plan=[];save();draw()">Clear day</button>':""}`},
mentor(){
 const od=S.tasks.filter(t=>!t.done&&days(t.due)<0).length,
 soon=S.tasks.filter(t=>!t.done&&days(t.due)>=0&&days(t.due)<=2),
 ex=allEv().filter(e=>e.type=="Exam"&&days(e.date)>=0).sort((a,b)=>a.date<b.date?-1:1)[0],m=[];
 if(od)m.push(`You have ${od} overdue assignment${od>1?"s":""}. Finish the smallest one first to build momentum.`);
 soon.forEach(t=>m.push(`⏰ Reminder: “${esc(t.t)}” is due ${when(days(t.due)).replace(/<[^>]+>/g,"")}.`));
 if(ex){const n=days(ex.date);m.push(n<=3?`${esc(ex.title)} is ${n==0?"today":"in "+n+" days"}. Do revision and past questions only; skip new topics.`:n<=14?`${esc(ex.title)} is in ${n} days. Split the syllabus into daily chunks and revise one per day.`:`${esc(ex.title)} is ${n} days away. A relaxed 1–2 hours daily is enough for now.`)}
 if(S.cab.length)m.push(`Last CAB note (${esc(S.cab[S.cab.length-1].s)}): revisit it before your next test.`);
 if(!m.length)m.push("Add your exams and assignments, and I’ll guide your week.");
 return `<h1>AI mentor</h1>${m.map(x=>`<div class="bubble">${x}</div>`).join("")}<h2>Ask your mentor</h2><div id="msgs">${chatHTML()}</div><div class="card row"><input id="cq" placeholder="Ask about studying, exams…" style="margin:0" onkeydown="if(event.key==='Enter')ask()"><button onclick="ask()">Send</button></div>`}
};
let cm=new Date(today().getFullYear(),today().getMonth(),1),cs=null;
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function calHTML(){
 const y=cm.getFullYear(),m=cm.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),t=iso(today()),mark={};
 allEv().forEach(e=>{(mark[e.date]=mark[e.date]||[]).push({t:e.title,c:e.type=="Exam"?"var(--bad)":e.type=="Holiday"?"var(--ok)":"var(--ac)"})});
 S.tasks.filter(x=>!x.done).forEach(x=>{(mark[x.due]=mark[x.due]||[]).push({t:"Due: "+x.t,c:"#f59e0b"})});
 let c="";for(let i=0;i<first;i++)c+="<div></div>";
 for(let d=1;d<=n;d++){const k=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"),mk=mark[k]||[];
  c+=`<div onclick="cs='${k}';draw()" style="text-align:center;padding:6px 0;border-radius:10px;cursor:pointer;${k==t?"background:var(--ac2);font-weight:700;":""}${k==cs?"outline:2px solid var(--ac);":""}">${d}<div style="height:6px;display:flex;justify-content:center;gap:2px">${mk.slice(0,3).map(x=>`<i style="width:5px;height:5px;border-radius:50%;background:${x.c}"></i>`).join("")}</div></div>`}
 const sel=cs?(mark[cs]?mark[cs].map(x=>`<div class="mu" style="margin-top:4px"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${x.c};margin-right:6px"></i>${esc(x.t)}</div>`).join(""):'<div class="mu" style="margin-top:6px">Nothing on this day.</div>'):"";
 return `<div class="card"><div class="row"><button class="x" onclick="cm=new Date(${y},${m-1},1);draw()">‹</button><b class="g" style="text-align:center">${cm.toLocaleString("en",{month:"long"})} ${y}</b><button class="x" onclick="cm=new Date(${y},${m+1},1);draw()">›</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px">${"SMTWTFS".split("").map(d=>`<div class="mu" style="text-align:center;font-size:11px">${d}</div>`).join("")}${c}</div>${sel}</div>`}
let H={events:[],notes:[],files:[],news:[]},isHost=false,hdb=null,hassets=null;
const allEv=()=>[...H.events.map((e,i)=>({...e,h:1,i})),...S.events.map((e,i)=>({...e,i}))];
function newsHTML(){return H.news.slice().reverse().slice(0,3).map(n=>`<div class="card" style="border-left:4px solid var(--ac)">📢 ${esc(n.t)}<div class="mu">${esc(n.d||"")}</div></div>`).join("")}
function sharedHTML(){const x=i=>isHost?`<button class="x" onclick="hdel('%)">✕</button>`.replace("%",i):"";
 const n=H.notes.map((o,i)=>`<div class="card"><div class="row"><b class="g">🏫 ${esc(o.s)}</b>${x("notes',"+i)}</div><div style="white-space:pre-wrap">${esc(o.t)}</div></div>`).join("");
 const f=H.files.map((o,i)=>`<div class="card row"><div class="g">📎 <a href="${esc(o.url)}" target="_blank" rel="noopener" style="color:var(--ac)">${esc(o.n)}</a></div>${x("files',"+i)}</div>`).join("");
 return n||f?`<h2>From your teacher</h2>${n}${f}`:""}
window.fbSet=(h,d)=>{isHost=h;if(d)H=Object.assign({events:[],notes:[],files:[],news:[]},d);draw()};
window.fbBind=(a,b)=>{hdb=a;hassets=b};
let chat=[],busy=false;
function chatHTML(){return chat.length?chat.map(c=>`<div class="bubble" style="${c.r=='user'?'margin-left:36px;background:var(--card);border:1px solid var(--bd)':'margin-right:12px'};white-space:pre-wrap">${esc(c.c)}</div>`).join(""):'<p class="mu">Try: “How should I plan my week?” or “Help me revise for my next exam.”</p>'}
function upd(){const m=$("#msgs");if(m)m.innerHTML=chatHTML()}
async function ask(){
 const el=$("#cq"),q=el.value.trim();if(!q||busy)return;
 el.value="";chat.push({r:"user",c:q});chat.push({r:"assistant",c:"Thinking…"});busy=true;upd();
 const last=chat.length-1;
 try{
  const sample=(window.claude?await claude.use("sample"):null);
  if(!sample)throw {message:"The AI mentor is not connected in this build yet."};
  const ctx=JSON.stringify({today:new Date().toISOString().slice(0,10),assignments:S.tasks,dates:S.events,cab_observations:S.cab,subjects:S.notes.map(n=>n.s)});
  const msgs=chat.slice(0,-1).map(c=>({role:c.r,content:c.c}));
  msgs[0].content="You are a warm, practical study mentor for a college student. Use their data below when relevant. Reply in under 120 words, plain text, no markdown.\nStudent data: "+ctx+"\n\nConversation:\n"+msgs[0].content;
  await sample(msgs,{cache:false,modelTier:"quick",onText:({text})=>{chat[last].c=text;upd()}});
 }catch(e){chat[last].c="Sorry, I couldn’t reach the mentor ("+(e.message||e.code||"error")+").";upd()}
 busy=false;
}
function draw(){
 const dn=S.tasks.filter(t=>!t.done&&days(t.due)<=1).length;
 $("#app").innerHTML=(dn?`<div class="card" style="border-color:var(--bad)">⏰ ${dn} assignment${dn>1?"s":""} overdue or due by tomorrow</div>`:"")+V[tab]();
 $("#nav").innerHTML=TABS.map(t=>`<button class="${t[0]==tab?"on":""}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join("");
}
draw();
</script>
<script>
let lastData="";
const srv=()=>{try{return localStorage.getItem("srv")||""}catch(e){return ""}};
const srvLabel=()=>srv()||"this page";
function setSrv(){const v=prompt("Server address, e.g. http://192.168.1.5:8000",srv());if(v!==null){try{localStorage.setItem("srv",v.trim().replace(/\/+$/,""))}catch(e){}lastData="";pull();draw()}}
async function pull(){try{const r=await fetch(srv()+"/api/data",{cache:"no-store"});if(!r.ok)return;const t=await r.text();if(t!==lastData){lastData=t;fbSet(false,JSON.parse(t))}}catch(e){}}
pull();setInterval(pull,10000);
</script>
</body>
</html>
