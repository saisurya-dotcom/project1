name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {app: student, name: "CSC & CSD Tracker", id: com.cscsd.tracker}
          - {app: host, name: "CSC CSD Host", id: com.cscsd.host}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create app
        run: |
          mkdir build && cd build
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www && cp ../${{ matrix.app }}.html www/index.html
          echo '{"appId":"${{ matrix.id }}","appName":"${{ matrix.name }}","webDir":"www","server":{"androidScheme":"http","cleartext":true}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: cd build/android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
